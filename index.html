<title>Freshman Grindset</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0e0b16; touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  #wrap { position:fixed; inset:0; overflow:hidden; background:#0e0b16; }
  canvas { position:absolute; top:0; left:0; display:block; touch-action:none; }
</style>

<div id="wrap">
  <canvas id="c"></canvas>
</div>

<script>
"use strict";
/* =============================================================================
   FRESHMAN GRINDSET  —  a parody. stay in school.
   One self-contained file. Isometric 2.5D comedy game.
   Systems in order below:
     [BOOT]      canvas / DPR / resize
     [ISO]       projection + box/floor renderer + palettes
     [INPUT]     pointer joystick + action button + keyboard
     [MAP]       procedural school grid + furniture + nav
     [PATH]      BFS pathfinding
     [ENTITIES]  player + npc actors, character renderer
     [AI]        customers + hall monitor + big toe
     [SCHEDULE]  bell periods
     [GAME]      deals / heat / bust / day summary / persistence
     [UI]        screens, hud, toasts, dialog, on-screen controls
     [RENDER]    world composite
     [LOOP]      update + raf
   ========================================================================== */
(function(){

// ============================== [BOOT] ======================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let VW=0, VH=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW*DPR); canvas.height = Math.floor(VH*DPR);
  canvas.style.width = VW+'px'; canvas.style.height = VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();

// small utils
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

// ============================== [ISO] =======================================
const TW2=27, TH2=13.5;          // half tile width/height (2:1 iso)
let camX=0, camY=0;              // world-space camera target (tiles)
let OX=0, OY=0;                  // screen origin offset (px)
function updateCam(px,py){
  camX=lerp(camX,px,0.14); camY=lerp(camY,py,0.14);
  OX = VW/2 - (camX-camY)*TW2;
  OY = VH/2 - (camX+camY)*TH2 - 40;
}
// world tile (x,y) + pixel elevation z -> screen
function sx(x,y){ return OX + (x-y)*TW2; }
function sy(x,y,z){ return OY + (x+y)*TH2 - (z||0); }

// shade a hex color by factor
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*f),0,255); g=clamp(Math.round(g*f),0,255); b=clamp(Math.round(b*f),0,255);
  return 'rgb('+r+','+g+','+b+')';
}
// draw an extruded box. center tile (cx,cy), half extents (hx,hy) in tiles,
// zBot..zTop pixel elevation. col = base hex (top light, faces darker).
function box(cx,cy,hx,hy,zBot,zTop,col,glow){
  const ax=cx-hx, bx=cx+hx, ay=cy-hy, by=cy+hy;
  // south face (D-C), then east face (B-C), then top
  const p=ctx;
  // south / front-left face
  p.fillStyle=shade(col,0.62);
  p.beginPath();
  p.moveTo(sx(ax,by), sy(ax,by,zTop));
  p.lineTo(sx(bx,by), sy(bx,by,zTop));
  p.lineTo(sx(bx,by), sy(bx,by,zBot));
  p.lineTo(sx(ax,by), sy(ax,by,zBot));
  p.closePath(); p.fill();
  // east / front-right face
  p.fillStyle=shade(col,0.80);
  p.beginPath();
  p.moveTo(sx(bx,ay), sy(bx,ay,zTop));
  p.lineTo(sx(bx,by), sy(bx,by,zTop));
  p.lineTo(sx(bx,by), sy(bx,by,zBot));
  p.lineTo(sx(bx,ay), sy(bx,ay,zBot));
  p.closePath(); p.fill();
  // top face
  p.fillStyle=glow?glow:col;
  p.beginPath();
  p.moveTo(sx(ax,ay), sy(ax,ay,zTop));
  p.lineTo(sx(bx,ay), sy(bx,ay,zTop));
  p.lineTo(sx(bx,by), sy(bx,by,zTop));
  p.lineTo(sx(ax,by), sy(ax,by,zTop));
  p.closePath(); p.fill();
}
// flat floor diamond at z=0
function floorTile(cx,cy,col,edge){
  const p=ctx;
  p.fillStyle=col;
  p.beginPath();
  p.moveTo(sx(cx-0.5,cy-0.5), sy(cx-0.5,cy-0.5,0));
  p.lineTo(sx(cx+0.5,cy-0.5), sy(cx+0.5,cy-0.5,0));
  p.lineTo(sx(cx+0.5,cy+0.5), sy(cx+0.5,cy+0.5,0));
  p.lineTo(sx(cx-0.5,cy+0.5), sy(cx-0.5,cy+0.5,0));
  p.closePath(); p.fill();
  if(edge){ p.strokeStyle=edge; p.lineWidth=1; p.stroke(); }
}
function blobShadow(x,y,r){
  const p=ctx;
  p.fillStyle='rgba(20,12,30,0.28)';
  p.beginPath();
  p.ellipse(sx(x,y), sy(x,y,0), r*TW2, r*TH2, 0,0,Math.PI*2);
  p.fill();
}

// ============================== [INPUT] =====================================
const keys={};
let actionPress=false;      // edge trigger consumed by game
let shovePress=false;       // edge trigger for shove
const joy={active:false,pid:-1,ox:0,oy:0,dx:0,dy:0};
const look={active:false,pid:-1,lx:0,sx0:0,sy0:0,t0:0,moved:0};
const LOOK_RATE=0.28/100;   // rad per px
let actBtnPid=-1, shoveBtnPid=-1;
const uiButtons=[];         // rebuilt each frame: {x,y,w,h,r,onTap}

function hitButton(px,py){
  for(let i=uiButtons.length-1;i>=0;i--){
    const b=uiButtons[i];
    if(b.r!=null){ if(dist2(px,py,b.x,b.y)<=b.r*b.r){ b.onTap(); return true; } }
    else if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){ b.onTap(); return true; }
  }
  return false;
}
function actBtnRect(){ const r=Math.min(62,VW*0.13); return {x:VW-r-26, y:VH-r-42, r:r}; }
function shoveBtnRect(){ const r=Math.min(50,VW*0.108); const ab=actBtnRect(); return {x:ab.x-ab.r-r-14, y:VH-r-52, r:r}; }

// screens where a tap ANYWHERE advances to the next state (so a missed button never traps you)
const ADVANCE_SCREEN={
  title: ()=>startDay(),
  actintro: ()=>showDayStory(),
  story: ()=>beginDay(),
  summary: ()=>afterSummary(),
  scene: ()=>advanceScene(),
};
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  auStart();                                 // WebAudio needs a user gesture
  const px=e.clientX, py=e.clientY;
  if(hitButton(px,py)) return;               // a real on-screen button was hit
  // non-play screens: tap anywhere advances (crossroads/ending need a real choice, excluded)
  if(G.screen!=='play'){ const adv=ADVANCE_SCREEN[G.screen]; if(adv) adv(); return; }
  // action button (bottom-right) — check first so it isn't swallowed by the joystick
  const ab=actBtnRect();
  if(dist2(px,py,ab.x,ab.y)<=(ab.r*1.3)*(ab.r*1.3)){
    actBtnPid=e.pointerId; actionPress=true; return;
  }
  // shove button (left of action)
  const sb=shoveBtnRect();
  if(dist2(px,py,sb.x,sb.y)<=(sb.r*1.3)*(sb.r*1.3)){
    shoveBtnPid=e.pointerId; shovePress=true; return;
  }
  // FIRST PERSON: right half drags the camera (yaw), left half moves.
  if(VIEW==='fp' && px>VW*0.5 && !look.active){
    look.active=true; look.pid=e.pointerId; look.lx=px;
    look.sx0=px; look.sy0=py; look.t0=performance.now(); look.moved=0;
    return;
  }
  // anywhere else = floating joystick (left half in FP, either half in ISO)
  joy.active=true; joy.pid=e.pointerId; joy.ox=px; joy.oy=py; joy.dx=0; joy.dy=0;
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId===look.pid && look.active){
    e.preventDefault();
    const dx=e.clientX-look.lx; look.lx=e.clientX;
    fpYaw+=dx*LOOK_RATE;
    look.moved=Math.max(look.moved, Math.hypot(e.clientX-look.sx0, e.clientY-look.sy0));
    return;
  }
  if(e.pointerId===joy.pid && joy.active){
    e.preventDefault();
    let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy;
    const m=Math.hypot(dx,dy), max=44;
    if(m>max){ dx=dx/m*max; dy=dy/m*max; }
    joy.dx=dx/max; joy.dy=dy/max;
  }
},{passive:false});
function endPointer(e){
  if(e.pointerId===look.pid){
    // a small, quick right-half touch is a context action (same as the ACTION button)
    if(look.moved<10 && performance.now()-look.t0<250 && G.screen==='play') actionPress=true;
    look.active=false; look.pid=-1; look.moved=0;
  }
  if(e.pointerId===joy.pid){ joy.active=false; joy.pid=-1; joy.dx=0; joy.dy=0; }
  if(e.pointerId===actBtnPid){ actBtnPid=-1; }
  if(e.pointerId===shoveBtnPid){ shoveBtnPid=-1; }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
window.addEventListener('blur',()=>{ joy.active=false; joy.pid=-1; joy.dx=0; joy.dy=0; look.active=false; look.pid=-1; });

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  auStart();
  keys[k]=true;
  if(k==='e'||k===' '){ actionPress=true; e.preventDefault(); }
  if(k==='q'){ shovePress=true; e.preventDefault(); }
  if(k==='c'||k==='shift'){ if(VIEW==='fp'&&G.screen==='play'){ player.sneak=!player.sneak; } }
  if(k==='v'){ setView(VIEW==='fp'?'iso':'fp'); }
  if(k==='m'){ auMute(!AU.muted); }
  if(k==='enter'){ if(G.screen==='title')startDay(); else if(G.screen==='summary')afterSummary(); else if(G.screen==='story')beginDay(); else if(G.screen==='actintro')showDayStory(); else if(G.screen==='scene')advanceScene(); }
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

function inputVector(){
  let x=0,y=0;
  if(joy.active){ x=joy.dx; y=joy.dy; }
  if(keys['a']||keys['arrowleft']) x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  if(keys['w']||keys['arrowup']) y-=1;
  if(keys['s']||keys['arrowdown']) y+=1;
  const m=Math.hypot(x,y);
  if(m>1){ x/=m; y/=m; }
  // screen vector -> iso world vector (rotate): screen up = world (-1,-1) etc.
  // convert desired screen dir to world dir
  const wx=(x/TW2 + y/TH2)/2;
  const wy=(y/TH2 - x/TW2)/2;
  const wm=Math.hypot(wx,wy);
  if(wm>0){ return {x:wx/wm*Math.min(1,m), y:wy/wm*Math.min(1,m), mag:Math.min(1,m)}; }
  return {x:0,y:0,mag:0};
}
// first-person: joystick / WASD are forward-back + strafe relative to camera yaw
const _fpv={x:0,y:0,mag:0};
function inputVectorFP(){
  let x=0,y=0;
  if(joy.active){ x=joy.dx; y=joy.dy; }
  if(keys['a']) x-=1;
  if(keys['d']) x+=1;
  if(keys['w']) y-=1;
  if(keys['s']) y+=1;
  const m=Math.hypot(x,y);
  if(m>1){ x/=m; y/=m; }
  const mag=Math.min(1,m);
  if(mag<0.03){ _fpv.x=0; _fpv.y=0; _fpv.mag=0; return _fpv; }
  const fx=Math.cos(fpYaw), fy=Math.sin(fpYaw);
  const rx=-Math.sin(fpYaw), ry=Math.cos(fpYaw);
  const wx=fx*(-y)+rx*x, wy=fy*(-y)+ry*x;
  const wm=Math.hypot(wx,wy)||1;
  _fpv.x=wx/wm*mag; _fpv.y=wy/wm*mag; _fpv.mag=mag;
  return _fpv;
}

// ============================== [MAP] =======================================
const MW=36, MH=38;
const F_VOID=0, F_HALL=1, F_CLASSA=2, F_CLASSB=3, F_BATH=4, F_JAN=5, F_GYM=6, F_LOCKER=7, F_SUPPLY=8;
const grid=new Array(MW*MH).fill(F_VOID);
const gi=(x,y)=>y*MW+x;
function setRoom(x0,y0,x1,y1,t){ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) grid[gi(x,y)]=t; }
setRoom(2,2,10,8,F_CLASSA);       // your class
setRoom(19,2,27,8,F_CLASSB);
setRoom(2,10,30,13,F_HALL);       // main hall (extended east)
setRoom(12,15,20,21,F_BATH);
setRoom(2,15,8,21,F_JAN);
setRoom(27,13,29,25,F_HALL);      // connector corridor (hall -> gym wing)
setRoom(17,25,33,35,F_GYM);       // gymnasium
setRoom(8,26,15,34,F_LOCKER);     // locker room
setRoom(12,21,13,26,F_JAN);       // janitor shortcut (bathroom <-> locker room, secret)
setRoom(2,23,5,27,F_SUPPLY);      // supply nook (secret $ pickup)
// doors (carve floor through walls)
grid[gi(6,9)]=F_HALL;   // classroom A -> hall
grid[gi(23,9)]=F_HALL;  // classroom B -> hall
grid[gi(16,14)]=F_HALL; // hall -> bathroom
grid[gi(5,14)]=F_HALL;  // hall -> janitor
grid[gi(16,29)]=F_GYM;  // locker room <-> gym door
grid[gi(3,22)]=F_JAN;   // janitor -> supply nook bridge

const isFloor=(x,y)=> x>=0&&y>=0&&x<MW&&y<MH && grid[gi(x,y)]!==F_VOID;
// walls: solid cells adjacent to a floor cell
const wallCells=[];
const sightBlock=new Uint8Array(MW*MH); // walls + full-cell furniture block LOS
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(!isFloor(x,y)){
    if(isFloor(x-1,y)||isFloor(x+1,y)||isFloor(x,y-1)||isFloor(x,y+1)){
      wallCells.push({x,y}); sightBlock[gi(x,y)]=1;
    }
  }
}
// lockers: flag some wall cells for blue coloring (hall + locker room)
const lockerSet=new Set();
for(const w of wallCells){
  if(w.y===9 && w.x>=3&&w.x<=29 && w.x!==6 && w.x!==23) lockerSet.add(gi(w.x,w.y));
  if(w.y===14 && (w.x>=17&&w.x<=26)) lockerSet.add(gi(w.x,w.y));
  if(w.x===7 && w.y>=27&&w.y<=33) lockerSet.add(gi(w.x,w.y)); // locker room west wall
  if(w.y===25 && w.x>=9&&w.x<=14) lockerSet.add(gi(w.x,w.y)); // locker room north wall
}

// ---- furniture ----
// each: {kind,x,y,hx,hy,h,col,cell(bool blocks cell)}
const furniture=[];
let yourDesk=null;
function addFurn(o){ furniture.push(o); if(o.cell){ sightBlock[gi(Math.round(o.x),Math.round(o.y))]|= o.blockSight?1:0; } return o; }
// classroom A desks (your class)
for(let r=0;r<3;r++)for(let c=0;c<4;c++){
  const x=3+c*2, y=3+r*2;
  const mine=(c===1&&r===1);
  const d=addFurn({kind:'desk',x,y,hx:0.34,hy:0.34,h:15,col:'#c98b52',cell:true,blockSight:false,mine});
  if(mine) yourDesk=d;
}
// classroom B desks (decor)
for(let r=0;r<3;r++)for(let c=0;c<4;c++){
  addFurn({kind:'desk',x:20+c*2,y:3+r*2,hx:0.34,hy:0.34,h:15,col:'#b7833f',cell:true,blockSight:false});
}
// bathroom stalls (block sight) + waiting spots
const waitSpots=[];
for(let i=0;i<4;i++){
  const x=13+i*2;
  addFurn({kind:'stall',x,y:15,hx:0.42,hy:0.42,h:32,col:'#7ec9a8',cell:true,blockSight:true});
  waitSpots.push({x, y:17, taken:null, room:'bath'});
}
// sinks along bath left wall
for(let i=0;i<3;i++) addFurn({kind:'sink',x:12,y:17+i,hx:0.28,hy:0.32,h:14,col:'#e7edf2',cell:false});
// blackboard sign (north wall classroom A) — purely visual anchor
const board={x:6,y:1.6};
// janitor shelves
addFurn({kind:'shelf',x:3,y:15,hx:0.4,hy:0.3,h:26,col:'#8a6d4a',cell:false});
addFurn({kind:'shelf',x:7,y:20,hx:0.4,hy:0.3,h:22,col:'#8a6d4a',cell:false});
// supply nook shelves + a one-time cash pickup marker (position stored)
addFurn({kind:'shelf',x:3,y:24,hx:0.4,hy:0.3,h:24,col:'#7c6142',cell:false});
addFurn({kind:'shelf',x:4,y:26,hx:0.4,hy:0.3,h:20,col:'#7c6142',cell:false});
const supplyPickupPos={x:3.5,y:26};
// ---- locker room: benches + a second deal spot ----
addFurn({kind:'bench',x:10,y:31,hx:0.7,hy:0.22,h:9,col:'#9a7a4e',cell:false});
addFurn({kind:'bench',x:13,y:31,hx:0.7,hy:0.22,h:9,col:'#9a7a4e',cell:false});
waitSpots.push({x:11,y:29,taken:null,room:'locker'});
waitSpots.push({x:13,y:29,taken:null,room:'locker'});
// ---- gymnasium: bleachers along south wall + court centre ----
const GYM_CENTER={x:25,y:30};
for(let i=0;i<6;i++){
  addFurn({kind:'bleacher',x:19+i*2,y:34,hx:0.9,hy:0.32,h:8+ (i%2)*4,col:'#b0563a',cell:false});
}
addFurn({kind:'hoop',x:25,y:25.4,hx:0.1,hy:0.1,h:42,col:'#d94f3a',cell:false});
addFurn({kind:'hoop',x:25,y:34.6,hx:0.1,hy:0.1,h:42,col:'#d94f3a',cell:false});

// ---- static dressing props (cheap, non-blocking) ----
const PROPS=[
  {kind:'fountain',x:9.5,y:10.2},
  {kind:'trash',x:2.6,y:12.4},
  {kind:'trash',x:29.6,y:12.4},
  {kind:'trash',x:18,y:12.6},
  {kind:'trophy',x:27,y:10.2},
  {kind:'poster',x:12,y:9.55,txt:'PROM?',col:'#e05f9a'},
  {kind:'poster',x:18,y:9.55,txt:'MATHLETES',col:'#4a8fd0'},
  {kind:'poster',x:25,y:9.55,txt:'GO TEAM',col:'#d0a04a',torn:true},
  {kind:'cone',x:6.4,y:16.2},
  {kind:'cone',x:22,y:26},
];
const LIGHT_POOLS=[{x:9,y:11.5},{x:16,y:11.5},{x:24,y:11.5},{x:16,y:18},{x:5,y:18},{x:25,y:30},{x:12,y:30},{x:6,y:5},{x:23,y:5},{x:28,y:20}];

// nav grid (walkable, minus full-cell furniture)
const nav=new Uint8Array(MW*MH);
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) nav[gi(x,y)]= isFloor(x,y)?1:0;
for(const f of furniture){ if(f.cell) nav[gi(Math.round(f.x),Math.round(f.y))]=0; }
// keep your-desk-adjacent cell walkable for sitting approach (south of desk)
const navWalk=(x,y)=> x>=0&&y>=0&&x<MW&&y<MH && nav[gi(x,y)]===1;

// collision for player circle: sample floor + furniture rects
function canStand(x,y){
  if(!isFloor(Math.floor(x),Math.floor(y))) return false;
  return true;
}
function blockedByFurn(x,y,rad){
  for(const f of furniture){
    if(!f.cell) continue;
    const hx=f.hx+rad, hy=f.hy+rad;
    if(x>f.x-hx&&x<f.x+hx&&y>f.y-hy&&y<f.y+hy) return true;
  }
  return false;
}
function walkPoint(x,y){ return isFloor(Math.floor(x),Math.floor(y)); }

// move a circle actor with wall+furniture sliding
function moveActor(a,vx,vy,dt){
  const rad=0.26;
  let nx=a.x+vx*dt, ny=a.y+vy*dt;
  // X axis
  if(walkPoint(nx+Math.sign(vx)*rad, a.y) && !blockedByFurn(nx,a.y,rad)) a.x=nx;
  // Y axis
  if(walkPoint(a.x, ny+Math.sign(vy)*rad) && !blockedByFurn(a.x,ny,rad)) a.y=ny;
}

// ============================== [PATH] ======================================
function findPath(sx0,sy0,gx,gy){
  sx0=clamp(Math.round(sx0),0,MW-1); sy0=clamp(Math.round(sy0),0,MH-1);
  gx=clamp(Math.round(gx),0,MW-1); gy=clamp(Math.round(gy),0,MH-1);
  if(!navWalk(gx,gy)){ // find nearest walkable to goal
    let best=null,bd=1e9;
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){ if(navWalk(x,y)){const d=dist2(x,y,gx,gy); if(d<bd){bd=d;best={x,y};}} }
    if(best){gx=best.x;gy=best.y;}
  }
  const start=gi(sx0,sy0);
  const prev=new Int32Array(MW*MH).fill(-1);
  const seen=new Uint8Array(MW*MH);
  const q=[start]; seen[start]=1; prev[start]=start;
  const goal=gi(gx,gy); let found=false;
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const cur=q.shift();
    if(cur===goal){found=true;break;}
    const cx=cur%MW, cy=(cur/MW)|0;
    for(const[dx,dy]of nb){
      const x=cx+dx, y=cy+dy;
      if(x<0||y<0||x>=MW||y>=MH) continue;
      const ni=gi(x,y);
      if(seen[ni]||nav[ni]!==1) continue;
      seen[ni]=1; prev[ni]=cur; q.push(ni);
    }
  }
  if(!found) return [];
  const path=[]; let c=goal;
  while(c!==start){ path.push({x:(c%MW)+0.5, y:((c/MW)|0)+0.5}); c=prev[c]; if(c<0)break; }
  path.reverse();
  return path;
}
// line of sight (walls + stalls block)
function hasLOS(ax,ay,bx,by){
  const steps=Math.ceil(Math.hypot(bx-ax,by-ay)*3);
  for(let i=1;i<steps;i++){
    const t=i/steps, x=Math.floor(lerp(ax,bx,t)), y=Math.floor(lerp(ay,by,t));
    if(x<0||y<0||x>=MW||y>=MH) return false;
    if(sightBlock[gi(x,y)]) return false;
  }
  return true;
}

// draw a blocky character at its foot position — richer silhouette
function drawActor(a){
  const tall = a.tall? 1.18 : 1;
  const wob = (a.dizzy>0)? Math.sin(a.phase*6)*1.5 : 0;
  const bob = a.moving? Math.abs(Math.sin(a.phase*2))*2.5 : 0;
  const pal=a.pal;
  const fx=Math.cos(a.facing), fy=Math.sin(a.facing);
  const swing = a.moving? Math.sin(a.phase*2)*0.13 : 0;
  const bodyTop=(26+bob)*tall;
  // backpack (students) — drawn behind body, offset away from facing (north side)
  if(pal.pack){ box(a.x-fx*0.12, a.y-fy*0.12, 0.17,0.14, 9+bob, 24+bob, pal.pack); }
  // legs (two)
  const lx=fy*0.12, ly=-fx*0.12;
  box(a.x+lx+fx*swing, a.y+ly+fy*swing, 0.10,0.10, 0,9, pal.legs);
  box(a.x-lx-fx*swing, a.y-ly-fy*swing, 0.10,0.10, 0,9, pal.legs);
  // arms (two side boxes that swing opposite to legs)
  const armS=-swing;
  box(a.x+lx*1.9+fx*armS, a.y+ly*1.9+fy*armS, 0.07,0.07, 12+bob, 24+bob, pal.skin);
  box(a.x-lx*1.9-fx*armS, a.y-ly*1.9-fy*armS, 0.07,0.07, 12+bob, 24+bob, pal.skin);
  // body
  box(a.x,a.y,0.24,0.20, 8+bob, bodyTop, pal.body);
  // polo collar + gold chain (Chadwick)
  if(pal.polo){
    box(a.x,a.y,0.20,0.17, bodyTop-4, bodyTop+2, pal.body2||pal.body);
    ctx.fillStyle='#ffd54a'; ctx.beginPath();
    ctx.arc(sx(a.x,a.y+0.16), sy(a.x,a.y+0.16,bodyTop-4)+2, 4, 0.15, Math.PI-0.15); ctx.lineWidth=2; ctx.strokeStyle='#ffd54a'; ctx.stroke();
  }
  if(pal.sash){ // hall monitor sash across body
    ctx.fillStyle=pal.sash;
    const zx=a.x, zy=a.y;
    ctx.beginPath();
    ctx.moveTo(sx(zx-0.24,zy+0.20), sy(zx-0.24,zy+0.20,24+bob));
    ctx.lineTo(sx(zx+0.24,zy+0.20), sy(zx+0.24,zy+0.20,14+bob));
    ctx.lineTo(sx(zx+0.24,zy+0.20), sy(zx+0.24,zy+0.20,10+bob));
    ctx.lineTo(sx(zx-0.24,zy+0.20), sy(zx-0.24,zy+0.20,20+bob));
    ctx.closePath(); ctx.fill();
  }
  if(pal.whistle){ ctx.fillStyle='#e8e8e8'; ctx.beginPath(); ctx.arc(sx(a.x,a.y+0.2),sy(a.x,a.y+0.2,bodyTop-6),2.2,0,7); ctx.fill(); }
  // head
  const headB=bodyTop, headT=bodyTop+13;
  box(a.x+wob*0.01,a.y,0.17,0.15, headB, headT, pal.skin);
  // hair — style variants
  const hs=a.hairStyle||0;
  if(pal.shades){ /* shades hide upper face; keep hair short */ box(a.x,a.y,0.18,0.16, headT-2, headT+3, pal.hair); }
  else if(hs===1){ box(a.x,a.y,0.19,0.17, headT-3, headT+6, pal.hair); box(a.x-fx*0.14,a.y-fy*0.14,0.1,0.1,headB+2,headT+2,pal.hair); } // fluffy/back
  else if(hs===2){ box(a.x,a.y,0.185,0.165, headT-2, headT+3, pal.hair); box(a.x,a.y,0.05,0.05,headT+3,headT+8,pal.hair); } // little tuft
  else { box(a.x,a.y,0.18,0.16, headT-2, headT+4, pal.hair); }
  if(pal.cap){ box(a.x,a.y,0.19,0.17, headT-1, headT+4, '#2a2a30'); box(a.x+fx*0.16,a.y+fy*0.16,0.09,0.09, headT-1, headT+1,'#2a2a30'); } // coach cap+brim
  // sunglasses (Chadwick) or two dot eyes
  const ez=(headB+6)+bob*0.0;
  if(pal.shades){ ctx.fillStyle='#15151c'; const yy=a.y+0.15; ctx.fillRect(sx(a.x-0.11,yy)-1, sy(a.x-0.11,yy,ez)-2, 6,3); ctx.fillRect(sx(a.x+0.03,yy)-1, sy(a.x+0.03,yy,ez)-2, 6,3); }
  else {
    ctx.fillStyle='#20242e'; const eox=0.06;
    ctx.beginPath(); ctx.arc(sx(a.x-eox,a.y+0.15), sy(a.x-eox,a.y+0.15,ez),1.7,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(sx(a.x+eox,a.y+0.15), sy(a.x+eox,a.y+0.15,ez),1.7,0,7); ctx.fill();
  }
}

function computeEnding(){
  const camp=G.camp, st=camp.stats;
  const allBeat=(st.actBeatChad||[]).length>=4 && st.actBeatChad.every(Boolean);
  if(camp.control>=100 && allBeat && (st.teacherShoves||0)===0) return ENDINGS.HUSTLER;
  if((st.busts||0)>=BUST_CAUTIONARY) return ENDINGS.CAUTIONARY;
  if(camp.brand==='GHOST' && (st.busts||0)<=3) return ENDINGS.LEGEND;
  if((camp.flags.chad==='nemesis'||camp.flags.chad==='broken') && (camp.flags.krunk==='war'||camp.flags.krunk==='owned')) return ENDINGS.KINGPIN;
  if(camp.flags.chad==='ally' && camp.flags.krunk==='paid') return ENDINGS.CEO;
  return ENDINGS.GRADUATE;
}
function openEnding(){
  const e=computeEnding();
  if(!G.camp.endingsSeen.includes(e.key)) G.camp.endingsSeen.push(e.key);
  G.endingResult=e;
  saveCampaign();
  G.screen='ending';
}
function restartCampaign(){
  const keepBest=G.best, seen=G.camp?G.camp.endingsSeen.slice():[];
  G.camp={act:1,actDay:1,clout:0,control:0,brand:null,flags:{},notoriety:0,endingsSeen:seen,
    stats:{busts:0,teacherShoves:0,actBeatChad:[false,false,false,false],totalCash:0,totalDeals:0},
    lastIntroAct:0, pendingTransition:null};
  saveCampaign();
  G.day=1; localStorage.setItem('fg_day','1');
  G.best=keepBest;
  G.endingResult=null;
  G.screen='title';
}
function openActIntro(){ G.camp.lastIntroAct=G.camp.act; saveCampaign(); G.screen='actintro'; }
G.camp = loadCampaign(); // boot: load or initialize campaign save (backward-compatible with pre-campaign saves)
function afterSummary(){
  if(!G.camp){ startDay(); return; }
  const pt=G.camp.pendingTransition;
  if(pt==='crossroads'){
    const key='cross'+G.camp.act;
    if(SCENES[key]) playScene(key, ()=>{ G.screen='crossroads'; });
    else G.screen='crossroads';
  }
  else if(pt==='ending'){
    const f=G.camp.flags||{};
    const key = f.chad==='ally' ? 'finaleAlly' : (f.krunk==='war' ? 'finaleKrunk' : 'finaleChad');
    if(SCENES[key]) playScene(key, ()=>openEnding());
    else openEnding();
  }
  else { startDay(); }
}

function playScene(key, next){
  const def=SCENES[key]; if(!def){ if(next)next(); return; }
  G.scene={def, idx:0}; G.sceneNext=next||null; G.screen='scene';
}
function advanceScene(){
  const sc=G.scene; if(!sc) return;
  sc.idx++;
  if(sc.idx>=sc.def.lines.length){
    G.scene=null; const n=G.sceneNext; G.sceneNext=null;
    if(n) n(); else G.screen='play';
  }
}

  wrapText(def.lines[sc.idx], VW/2, PY+34, PW-44, 20);
  // progress dots
  for(let i=0;i<def.lines.length;i++){
    ctx.beginPath(); ctx.arc(VW/2-(def.lines.length-1)*7+i*14, PY+100, 3.5, 0, 7);

function performAction(){
  if(G.dialog||G.shop||G.offer||G.activity) return; // overlays consume via buttons
  // FIRST PERSON: act on whatever the reticle is pointing at, not the nearest thing
  if(VIEW==='fp'){ if(performActionFP()) return; }
  const p=PERIODS[G.periodIdx];
  // gym: throw a dodgeball if holding one
  if(p.kind==='gym' && G.holdingBall && !player.rag){ throwBall(); return; }
  if(player.seated){ player.seated=false; return; }
  // 1 deal with nearest waiting customer
  let cust=null,cd=1.3*1.3;
  for(const c of G.customers){ if(c.state==='wait'){ const d=dist2(player.x,player.y,c.x,c.y); if(d<cd){cd=d;cust=c;} } }
  if(cust){ doDeal(cust); return; }
  // 2 re-up at big toe (breaks + sneaking during gym)
  if((p.kind==='pass'||p.kind==='lunch'||p.kind==='gym') && dist2(player.x,player.y,G.toe.x,G.toe.y)<1.6*1.6){ openShop(); return; }
  // 3 sit at your desk (regular class)
  if(p.kind==='class' && dist2(player.x,player.y,yourDesk.x,yourDesk.y)<1.3*1.3){
    player.seated=true; player.x=yourDesk.x; player.y=yourDesk.y+0.85; player.vx=0; player.vy=0; return;
  }
}
function actionLabel(){
  const p=PERIODS[G.periodIdx];
  if(VIEW==='fp'){
    const t=FPT;
    if(!t) return '·';
    if(t.kind==='throw') return 'THROW 🤾';
    if(t.kind==='stand') return 'STAND';
    if(t.kind==='deal') return 'DEAL 💵';
    if(t.kind==='shop') return 'RE-UP';
    if(t.kind==='sit') return 'SIT';
    if(t.kind==='ball') return 'GRAB 🏐';
    return '·';
  }
  if(p.kind==='gym' && G.holdingBall && !player.rag) return 'THROW 🤾';
  if(player.seated) return 'STAND';
  for(const c of G.customers){ if(c.state==='wait'&&dist2(player.x,player.y,c.x,c.y)<1.3*1.3) return 'DEAL 💵'; }
  if((p.kind==='pass'||p.kind==='lunch'||p.kind==='gym')&&dist2(player.x,player.y,G.toe.x,G.toe.y)<1.6*1.6) return 'RE-UP';
  if(p.kind==='class'&&dist2(player.x,player.y,yourDesk.x,yourDesk.y)<1.3*1.3) return 'SIT';
  return '·';
}

function chooseDealProduct(cust){
  if(cust.want){
    if((G.inv[cust.want]||0)>0){ const pr=PROD_BY_ID[cust.want]; return {id:cust.want, price:pr.sell, matched:true}; }
    const sub=invFirstStocked();
    if(!sub) return {dry:true};
    if(Math.random()<0.4) return {refused:true};     // won't take a substitute
    return {id:sub, price:Math.round(PROD_BY_ID[sub].sell*0.6), sub:true};
  }
  const id=invFirstStocked();
  if(!id) return {dry:true};
  return {id, price:PROD_BY_ID[id].sell};
}
function doDeal(cust){
  if(!invHasAny()){ pushToast("you're DRY 😩 re-up at Big Toe",'',3); openDialog(cust,['you: bro im all out','('+cust.name+' fake cries)']); freeCustomer(cust,false); return; }
  const choice=chooseDealProduct(cust);
  if(choice.dry){ pushToast("you're DRY 😩 re-up at Big Toe",'',3); openDialog(cust,['you: bro im all out','('+cust.name+' fake cries)']); freeCustomer(cust,false); return; }
  if(choice.refused){ const w=PROD_BY_ID[cust.want]; openDialog(cust,['you: only got other stuff', cust.name+': i asked for '+w.short+' 😤 nvm']); freeCustomer(cust,false); return; }
  const seen = monitorSeesPlayer();
  if(Math.random()<0.18){
    G.offer={cust, choice, price: Math.max(8, Math.round(choice.price*rand(0.45,0.62))), line:pick(LOWBALL_LINES)};
    return;
  }
  let price=choice.price;
  if(choice.matched) price=Math.round(price*rand(1.0,1.25));   // premium for exact ask
  else price=Math.round(price*rand(0.85,1.05));
  price=Math.round(price*(G.priceMult||1)*(cust.premium||1)*brandDealMult());  // day economy + note intel + brand
  finishDeal(cust, price, seen, choice.id, choice.matched);
}
function finishDeal(cust, price, seen, prodId, matched){
  G.cash+=price; G.inv[prodId]=Math.max(0,(G.inv[prodId]||0)-1); G.deals++;
  G.cashPop=1; cashFloat('+$'+price, player.x, player.y-0.2, '#8fe08f');
  VM.deal=1; SFX.chaching();
  if(G.camp) addClout(matched?3:2, matched?'exact-match deal':'deal');
  const pr=PROD_BY_ID[prodId];

  const l1 = matched? 'you: '+pr.emoji+' exactly what u wanted — $'+price : 'you: '+pr.emoji+' that\'s $'+price+' 💨';
  openDialog(cust,[l1, cust.name+': '+pick([ex[0],ex[1]])]);
  if(seen){ G.heat=clamp(G.heat+Math.round(28*heatMult()),0,100); alertMonitor(); pushToast('the MONITOR saw that deal 😳','',3); }
  freeCustomer(cust,true, prodId);
}
function freeCustomer(cust,leaving, prodId){

  cust.path=findPath(cust.x,cust.y,exit.x,exit.y); cust.pi=0; cust.despawnT=leaving?11:6;

}
function openDialog(who,lines){ G.dialog={who,lines,t:2.6}; }
function openShop(){ G.shop=true; }
function buyProduct(id){ const pr=PROD_BY_ID[id]; if(invTotal()<MAX_ITEMS && G.cash>=pr.buy){ G.cash-=pr.buy; G.inv[id]=(G.inv[id]||0)+1; return true; } return false; }

function alertMonitor(){ const m=G.monitor; m.mode='chase'; m.lostT=0; m.repath=0; }
function monitorSeesPlayer(){
  const m=G.monitor; if(!m||player.seated) return false;
  const d2=dist2(m.x,m.y,player.x,player.y);
  const visR=6.2*(1+notorietyBoost())*(player.sneak?0.8:1);
  if(d2>visR*visR) return false;
  const ang=Math.atan2(player.y-m.y, player.x-m.x);
  let da=Math.abs(((ang-m.facing+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(m.mode==='chase') { if(d2<2.5*2.5 && !fogBlocksLOS(m.x,m.y,player.x,player.y)) return true; } // close range wide awareness while chasing
  if(da>0.85) return false;
  if(fogBlocksLOS(m.x,m.y,player.x,player.y)) return false; // Silent Hill Mint blocks the cone
  return hasLOS(m.x,m.y,player.x,player.y);
}
function busted(){

  let lost=0; for(const p of PRODUCTS){ lost+=G.inv[p.id]||0; G.inv[p.id]=0; }

function endDay(){
  G.screen='summary';
  if(G.cash>G.best){ G.best=G.cash; localStorage.setItem('fg_best',G.best); }
  // snitch fines (kids shoved twice) resolve now
  let snitchTotal=0;
  for(const line of G.snitchFines){ snitchTotal+=line.amt; }
  G.cash=Math.max(0, G.cash - snitchTotal);
  // letter grade
  const score=G.cash - G.busted*22 + G.deals*4;
  let grade,quip;
  if(score>=340){grade='S';quip='Certified Hustler — see the guidance counselor immediately';}
  else if(score>=240){grade='A';quip='honor roll of the streets (hallways)';}
  else if(score>=160){grade='B';quip='solid grind, needs to lock in';}
  else if(score>=90){grade='C';quip='the vibes were mid tbh';}
  else if(score>=30){grade='D';quip='did you even come to school';}
  else {grade='F';quip='respectfully, cook a full meal';}
  // beating Chadwick bumps grade one letter
  const beatChad = G.cash > G.chadCash;
  const order=['F','D','C','B','A','S'];
  let bumped=grade, chadLine='';
  if(beatChad){
    const gi2=order.indexOf(grade); bumped=order[Math.min(order.length-1, gi2+1)];
    chadLine='You outsold Chadwick 📈 he\'s "pivoting to consulting." Grade +1.';
  } else {
    chadLine='Chadwick outsold you. He posted about it on LinkedIn. 💼';
  }
  // ---- CAMPAIGN: end-of-day clout, story mission check, act gate ----
  let missionResult=null, campToast=null;
  if(G.camp){
    const camp=G.camp;
    camp.stats.totalCash=(camp.stats.totalCash||0)+G.cash;
    camp.stats.totalDeals=(camp.stats.totalDeals||0)+G.deals;
    if(beatChad) addClout(10,'out-earned Chadwick');
    if(G.busted===0) addClout(5,'clean day, no busts');
    const wasMissionDay = (camp.actDay||1)>=5;
    if(wasMissionDay){
      camp.stats.actBeatChad=camp.stats.actBeatChad||[false,false,false,false];
      camp.stats.actBeatChad[camp.act-1]=beatChad;
      const md=MISSION_DEFS[camp.act];
      if(md){
        const win=md.check({cash:G.cash, chadCash:G.chadCash, busted:G.busted}, camp);
        if(win) addClout(25,'story mission complete');
        missionResult={name:md.name, win, line: win?md.winLine:md.loseLine};
      }
      const need=ACT_GATE[camp.act]||100;
      if(camp.control>=need){
        camp.pendingTransition = camp.act<4 ? 'crossroads' : 'ending';
      } else {
        camp.pendingTransition='replay';
        camp.actDay=1;
        campToast='Control only '+camp.control+'% — needed '+need+'% to clear this act. Running it back. 🔁';
      }
    } else {
      camp.actDay=(camp.actDay||1)+1;
      camp.pendingTransition='next';
    }
    saveCampaign();
  }
  G.dayEndStats={cash:G.cash, deals:G.deals, busted:G.busted, grade:bumped, baseGrade:grade,
    quip, chadCash:G.chadCash, beatChad, chadLine, snitches:G.snitchFines.slice(), snitchTotal,
    day:G.day, mission:missionResult, campToast, cloutToday:G.campCloutToday||0};
  G.day++; localStorage.setItem('fg_day', G.day);
}

// ============================== [AI] ========================================
function faceTo(a,tx,ty){ a.facing=Math.atan2(ty-a.y,tx-a.x); }
function followPath(a,spd,dt){
  if(a.pi>=a.path.length){ a.moving=false; return true; }
  const wp=a.path[a.pi];
  const dx=wp.x-a.x, dy=wp.y-a.y, m=Math.hypot(dx,dy);
  if(m<0.12){ a.pi++; return a.pi>=a.path.length; }
  const vx=dx/m*spd, vy=dy/m*spd;
  faceTo(a,wp.x,wp.y);
  moveActor(a,vx,vy,dt);
  a.moving=true; a.phase+=dt*10;
  return false;
}
const MON_WP=[{x:4,y:11.5},{x:14,y:11.5},{x:28,y:11.5},{x:28,y:20},{x:25,y:30},{x:12,y:30},{x:16,y:18},{x:14,y:11.5}];
function updateMonitor(dt){
  const m=G.monitor; if(!m) return;
  const p=PERIODS[G.periodIdx];
  const spd=3.6*1.12*(1+notorietyBoost()*0.4);
  // detection: dealing seen handled elsewhere; here catch "out of class in class time" or line of sight on suspicious player
  const classtime = p.kind==='class';
  const playerBad = !player.seated && classtime; // skipping class
  if(m.mode!=='chase' && monitorSeesPlayer() && (playerBad || G.heat>60)){
    alertMonitor(); pushToast(pick(['HALL MONITOR: "HALL PASS?!"','HALL MONITOR: "FRESHMAN DETECTED"','HALL MONITOR: "I have a SASH"']),'',2.6);
    G.heat=clamp(G.heat+Math.round(14*heatMult()),0,100);
  }
  if(m.mode==='chase'){
    m.repath-=dt;
    if(m.repath<=0){ m.path=findPath(m.x,m.y,player.x,player.y); m.pi=0; m.repath=0.35; }
    followPath(m, spd, dt);
    // caught?
    if(!player.seated && dist2(m.x,m.y,player.x,player.y)<0.62*0.62){ busted(); return; }
    // lost sight?
    if(monitorSeesPlayer() || player.seated){ m.lostT= player.seated?m.lostT+dt: 0; }
    else m.lostT+=dt;
    if(player.seated) m.lostT+=dt;
    const lostThresh=(G.camp&&G.camp.brand==='GHOST')?2.2:3.4;
    if(m.lostT>lostThresh){ m.mode='patrol'; m.wp=0; }
  } else {
    // patrol loop
    if(m.pi>=m.path.length){

// soft body collision: NPCs bounce off player with knockback + oof
function softCollide(){
  for(const c of [...G.customers, ...G.ambients]){
    if(c.rag || c.state==='sit') continue;
    const d2=dist2(c.x,c.y,player.x,player.y);
    if(d2<0.44*0.44 && d2>0.0001){
      const d=Math.sqrt(d2), nx=(c.x-player.x)/d, ny=(c.y-player.y)/d, push=(0.44-d);
      if(walkPoint(c.x+nx*push,c.y+ny*push)){ c.x+=nx*push; c.y+=ny*push; }
      if(c.oof<=0){ c.oof=0.6; }
    }
    if(c.oof>0) c.oof-=1/60;
  }
}

// ---- shove / ragdoll ----
function doShove(){
  if(player.rag||player.seated) return;
  const cand=[];
  for(const c of G.customers){ if(!c.rag && c.state!=='ragdoll') cand.push(c); }
  for(const a of G.ambients){ if(!a.rag) cand.push(a); }
  for(const t of G.teachers){ if(!t.rag) cand.push(t); }
  if(G.gymOn) for(const k of G.dodgers){ if(!k.rag) cand.push(k); }
  if(G.chadwick && !G.chadwick.rag) cand.push(G.chadwick);
  let best=null,bd=1.7*1.7;
  if(VIEW==='fp'){
    // in FP the shove goes where you're LOOKING, not at whoever is closest
    let bs=1e9;
    for(const c of cand){
      const dx=c.x-player.x, dy=c.y-player.y, d=Math.hypot(dx,dy);
      if(d>1.95) continue;
      const ang=Math.abs(angDiff(Math.atan2(dy,dx), fpYaw));
      if(ang>0.95) continue;
      const sc=ang*1.6+d*0.3; if(sc<bs){ bs=sc; best=c; }
    }
    VM.shove=1; fpKick=9;
  }
  if(!best){ for(const c of cand){ const d=dist2(player.x,player.y,c.x,c.y); if(d<bd){bd=d;best=c;} } }
  SFX.whoosh();
  if(!best){ bigText('*whiff*', player.x, player.y-0.2); return; }
  shoveActor(best);
}
function shoveActor(a){
  const dx=a.x-player.x, dy=a.y-player.y; const m=Math.hypot(dx,dy)||1;
  const nx=dx/m, ny=dy/m;
  const isChad=(a===G.chadwick);
  const power = isChad? 10.5 : rand(7,8.5);
  a.rag={state:'fly', vx:nx*power, vy:ny*power, z:2, vz:isChad?16:13, spin:rand(6,11)*(Math.random()<0.5?-1:1), ang:0, t:0};
  if(a.spot){ a.spot.taken=null; a.spot=null; }
  a.state='ragdoll'; a.squash=0.6;
  if(isChad){ a.shadesFly={x:a.x,y:a.y,z:34,vz:15,vx:nx*4.5,vy:ny*4.5,rot:0,vrot:9,t:1.6}; }
  bigText(isChad?'BONK 🕶️':pick(['OOF','BONK','OOF!','SKKRT']), a.x, a.y-0.2); SFX.bonk();
  G.shake=Math.max(G.shake, isChad?9:6);
  reactToShove(a);
  if(!isChad && !a.teacher) trackSnitch(a);
  shoveConsequences(a, isChad);
}

function updateRagdoll(a,dt){
  const r=a.rag; if(!r) return; r.t+=dt;
  if(a.squash>0) a.squash=Math.max(0,a.squash-dt*3);
  if(r.state==='fly'){
    r.ang+=r.spin*dt;
    let nx=a.x+r.vx*dt, ny=a.y+r.vy*dt;
    if(walkPoint(nx,a.y)) a.x=nx; else { r.vx*=-0.55; r.spin*=-0.7; a.squash=1.1; bigText('BONK', a.x,a.y-0.2); G.shake=Math.max(G.shake,4); }
    if(walkPoint(a.x,ny)) a.y=ny; else { r.vy*=-0.55; r.spin*=-0.7; a.squash=1.1; }
    r.vz-=42*dt; r.z+=r.vz*dt;
    if(r.z<=0){
      r.z=0;
      if(Math.abs(r.vz)>6){ r.vz=-r.vz*0.45; a.squash=1.3; addPuff(a.x,a.y,4); }
      else { r.state='down'; r.downT=(a===G.chadwick)?6:2; a.moving=false; addPuff(a.x,a.y,7);
        dropMoney(a, (a===G.chadwick)?randi(8,15):randi(2,6)); }
    }
    r.vx*=(1-1.2*dt); r.vy*=(1-1.2*dt);
  } else if(r.state==='down'){
    r.downT-=dt;
    if(r.downT<=0){
      if(a===G.chadwick){ chadwickGetsUp(); a.rag=null; }
      else if(a.teacher){ // teacher dusts off and returns to post, muttering
        a.rag=null; a.state='teach';
        a.path=findPath(a.x,a.y, Math.round(a.def.post.x), Math.round(a.def.post.y)+1); a.pi=0;
        pushToast(a.name+': "I am UNPAID for this." 😤', a.name, 2.6);
      }
      else if(a.ambient){ // ambient kid gets up and resumes wandering
        a.rag=null; a.state='roam'; a.roamT=0.5; a.scurry=1.4;
        const s2=pick(HALL_SPOTS); a.path=findPath(a.x,a.y,s2.x,s2.y); a.pi=0;
      }
      else {
        a.rag=null; a.state='leave'; a.scurry=1.4;
        const exit=pick([{x:3,y:11},{x:29,y:11}]);
        a.path=findPath(a.x,a.y,exit.x,exit.y); a.pi=0; a.despawnT=7;
        if(a.dodger){ // shoved dodger just returns
          a.state='dodger'; a.rag=null; a.holding=false; a.throwT=rand(1,3);
        }
      }
    }
  }
}

function nearestWallPoint(x,y){
  // step outward to find a wall to stare at; return a floor cell adjacent to a wall
  let best=null,bd=1e9;
  for(const w of wallCells){ const d=dist2(x,y,w.x,w.y); if(d<bd){ // find floor neighbour of this wall
    const ns=[[w.x+1,w.y],[w.x-1,w.y],[w.x,w.y+1],[w.x,w.y-1]];
    for(const[fx,fy]of ns){ if(walkPoint(fx+0.5,fy+0.5)){ bd=d; best={x:fx+0.5,y:fy+0.5,wx:w.x,wy:w.y}; break; } }
  } }
  return best||{x,y,wx:x,wy:y};
}
function hallLoopPath(x,y){ // a lap route around the main hall
  const pts=[{x:5,y:11.5},{x:14,y:12.5},{x:26,y:11.5},{x:28,y:12.5},{x:14,y:11.5}];
  return pts;
}
function updateEffect(c,dt){

      if(dist2(c.x,c.y,e.target.x,e.target.y)<0.16){ e.arrived=true; c.moving=false; faceTo(c,e.target.wx,e.target.wy); }
    } else { c.moving=false;
      if(!e.dropped){ e.dropped=true; dropMoney(c, randi(3,7)); pushToast(c.name+': "keep the change king 👑"','',2.6); }
    }
    if(e.t<=0){ c.effect=null; } // then resumes leave next frame
    return true;
  }
  if(e.id==='math'){ // sprint laps yelling math
    const wp=e.loop[e.li];
    faceTo(c,wp.x,wp.y); moveActor(c,(wp.x-c.x),(wp.y-c.y),dt*4.5); c.moving=true; c.phase+=dt*18;
    if(dist2(c.x,c.y,wp.x,wp.y)<0.3){ e.li=(e.li+1)%e.loop.length; }
    e.factT-=dt; if(e.factT<=0){ e.factT=1.6; bigText(pick(MATH_FACTS), c.x,c.y-0.3); }
    if(e.t<=0){ c.effect=null; }

  }
  if(e.id==='zoom'){ // DVD bounce, knock others
    let nx=c.x+e.vx*dt, ny=c.y+e.vy*dt;
    if(walkPoint(nx,c.y)) c.x=nx; else { e.vx*=-1; addPuff(c.x,c.y,3); G.shake=Math.max(G.shake,3); }
    if(walkPoint(c.x,ny)) c.y=ny; else { e.vy*=-1; addPuff(c.x,c.y,3); }

    if(e.t<=0){ c.effect=null; }
    return true;
  }
  if(e.id==='backfire'){ c.moving=false; if(e.t<=0){ c.effect=null; } return true; }
  return false;
}

function endGym(){ G.gymOn=false; G.dodgers=[]; G.balls=[]; G.coach=null; G.holdingBall=false; }
function throwBall(){
  if(!G.holdingBall) return;
  let t=null,bd=1e9; for(const k of G.dodgers){ if(k.rag)continue; const d=dist2(k.x,k.y,player.x,player.y); if(d<bd){bd=d;t=k;} }
  let dx=Math.cos(player.facing),dy=Math.sin(player.facing);
  if(t){ const m=Math.hypot(t.x-player.x,t.y-player.y)||1; dx=(t.x-player.x)/m; dy=(t.y-player.y)/m; }
  G.balls.push({x:player.x,y:player.y,z:16,vx:dx*10,vy:dy*10,vz:6,rest:false,thrownBy:'player',life:0});
  G.holdingBall=false; G.shake=Math.max(G.shake,3);
}
function throwFromDodger(k){
  const m=Math.hypot(player.x-k.x,player.y-k.y)||1; const dx=(player.x-k.x)/m,dy=(player.y-k.y)/m;
  G.balls.push({x:k.x,y:k.y,z:15,vx:dx*8.5+rand(-1,1),vy:dy*8.5+rand(-1,1),vz:6,rest:false,thrownBy:'kid',life:0});
  k.holding=false; k.throwT=rand(2,4.5);
}
function dodgerOut(k){
  const idx=G.dodgers.indexOf(k); if(idx<0)return;
  SFX.bonk(); dropMoney(k, randi(3,6)); addPuff(k.x,k.y,7); bigText(pick(['OUT!','REKT','BONK']), k.x,k.y-0.3);
  G.shake=Math.max(G.shake,5); G.dodgers.splice(idx,1);
}
function updateBalls(dt){
  for(let i=G.balls.length-1;i>=0;i--){
    const b=G.balls[i]; b.life+=dt;
    if(b.rest) continue;
    b.vz-=34*dt; b.z+=b.vz*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(!walkPoint(b.x,b.y)){ b.x-=b.vx*dt; b.y-=b.vy*dt; b.vx*=-0.5; b.vy*=-0.5; }
    // hits
    if(b.z>3 && b.z<32){
      if(b.thrownBy==='player'){
        for(const k of G.dodgers){ if(k.rag)continue; if(dist2(k.x,k.y,b.x,b.y)<0.55*0.55){ dodgerOut(k); b.rest=true; b.z=0; b.thrownBy=null; b.vx=b.vy=b.vz=0; break; } }
      } else if(b.thrownBy==='kid'){
        if(!player.rag && dist2(player.x,player.y,b.x,b.y)<0.55*0.55){ hitPlayerBall(); b.rest=true; b.z=0; b.thrownBy=null; b.vx=b.vy=b.vz=0; }
      }
    }
    if(b.z<=0){ b.z=0; b.vz=0; b.vx*=0.4; b.vy*=0.4; if(Math.hypot(b.vx,b.vy)<0.4){ b.rest=true; b.thrownBy=null; } }
  }
}
function hitPlayerBall(){ SFX.bonk(); if(VIEW==='fp'){ fpKick=16; } player.stagger=0.7; player.dizzy=1.6; G.shake=Math.max(G.shake,6); addPuff(player.x,player.y,4); bigText('OOF', player.x,player.y-0.3); if(G.holdingBall){ G.holdingBall=false; } }
function updateGym(dt){
  if(!G.gymOn) return;
  // coach
  const co=G.coach;
  if(co){ co.whistleT-=dt; co.lineT-=dt;
    if(co.lineT<=0){ pushToast(pick(COACH_LINES),' ',3.4); co.lineT=rand(6,10); co.whistle=0.5; }
    if(co.whistleT<=0){ co.whistleT=rand(3,6); co.whistle=0.4; }
    if(co.whistle>0) co.whistle-=dt;
    faceTo(co, player.x, player.y);
  }
  // player pick up resting ball
  if(!G.holdingBall && !player.rag){
    for(let i=G.balls.length-1;i>=0;i--){ const b=G.balls[i]; if(b.rest && dist2(b.x,b.y,player.x,player.y)<0.6*0.6){ G.balls.splice(i,1); G.holdingBall=true; break; } }
  }
  // dodger AI
  for(const k of G.dodgers){
    if(k.rag) continue;
    if(k.holding){ k.throwT-=dt; faceTo(k,player.x,player.y); k.moving=false; if(k.throwT<=0) throwFromDodger(k); continue; }
    // seek nearest resting ball
    let nb=null,bd=1e9; for(const b of G.balls){ if(b.rest){ const d=dist2(b.x,b.y,k.x,k.y); if(d<bd){bd=d;nb=b;} } }
    if(nb && bd<0.6*0.6){ const bi=G.balls.indexOf(nb); if(bi>=0)G.balls.splice(bi,1); k.holding=true; k.throwT=rand(0.5,1.4); k.moving=false; continue; }
    if(nb){ faceTo(k,nb.x,nb.y); moveActor(k,(nb.x-k.x),(nb.y-k.y),dt*2.4); k.moving=true; k.phase+=dt*12; }
    else { k.wanderT-=dt; if(k.wanderT<=0){ k.home={x:rand(20,31),y:rand(31,34)}; k.wanderT=rand(1,2.5); } faceTo(k,k.home.x,k.home.y); moveActor(k,(k.home.x-k.x)*0.6,(k.home.y-k.y)*0.6,dt*2); k.moving=dist2(k.x,k.y,k.home.x,k.home.y)>0.1; k.phase+=dt*8; }
  }
  updateBalls(dt);
  // coach notices absence from gym
  const inGym = grid[gi(clamp(Math.floor(player.x),0,MW-1),clamp(Math.floor(player.y),0,MH-1))]===F_GYM;
  if(!inGym){ G.coachNoticed+=dt; if(G.coachNoticed>2.5){ G.heat=clamp(G.heat+8*dt,0,100); if((G.coachNoticed%2)<dt){ pushToast('COACH: "WHERE IS '+'FRESHMAN'+'?!" 🗣️',' ',2); } } }
  else { G.coachNoticed=Math.max(0,G.coachNoticed-dt*2); }
}

}

function updateAmbients(dt){
  const p=PERIODS[G.periodIdx];
  const classTime = (p.kind==='class'||p.kind==='gym');
  for(const a of G.ambients){
    if(a.rag) continue;
    if(a.bubbleT>0){ a.bubbleT-=dt; if(a.bubbleT<=0)a.bubble=null; }
    if(a.oof>0) a.oof-=dt;
    const spd = a.scurry>0? 4.4 : 2.6;
    if(a.scurry>0) a.scurry-=dt;
    if(classTime){
      if(a.state==='sit'){ a.moving=false; continue; }
      if(a.state!=='toSeat'){ // head to your assigned desk, nerd
        a.state='toSeat';
        a.path=findPath(a.x,a.y, a.seat.x, a.seat.deskY+1); a.pi=0;
      }
      const done=followPath(a,spd,dt);
      if(done){ a.x=a.seat.x; a.y=a.seat.deskY+0.85; a.state='sit'; a.moving=false; a.facing=Math.atan2(-1,0); }
      else { a.phase+=dt*10; a.moving=true; }
    } else {
      if(a.state==='sit'||a.state==='toSeat'){ a.state='roam'; a.roamT=0; a.path=[]; a.pi=0; }
      if(a.path && a.pi<a.path.length){
        followPath(a,spd,dt); a.phase+=dt*10; a.moving=true;
      } else {
        a.moving=false;
        a.roamT-=dt;
        // gossip bubble if paused near another paused kid
        a.chatT-=dt;
        if(a.chatT<=0){
          a.chatT=rand(2,5);
          for(const b of G.ambients){
            if(b!==a && !b.moving && !b.rag && dist2(a.x,a.y,b.x,b.y)<2.2*2.2){
              a.bubble=pick(['🗣️','💀','😹','🤳','📱']); a.bubbleT=1.4; break;
            }
          }
        }
        if(a.roamT<=0){
          a.roamT=rand(2.5,6);
          const s2=pick(HALL_SPOTS);
          a.path=findPath(a.x,a.y,s2.x,s2.y); a.pi=0;
        }
      }
    }
  }
}
// ---- in-class activities (short comedy minigames while seated) ----
function startActivity(){
  const roll=Math.random();
  if(roll<0.30){ G.activity={type:'quiz', q:pick(QUIZ_QS), t:8, dur:8}; }
  else if(roll<0.55){ G.activity={type:'called', q:pick(CALLED_QS), t:7, dur:7}; }
  else if(roll<0.80){ G.activity={type:'awake', taps:0, need:8, t:4.5, dur:4.5}; }
  else { G.activity={type:'note', t:6, dur:6}; }
}
function resolveActivity(msg, dHeat, dCash){
  G.activity=null;
  if(msg) pushToast(msg,'',3.2);
  if(dHeat) G.heat=clamp(G.heat+dHeat,0,100);
  if(dCash){ G.cash+=dCash; G.cashPop=1; cashFloat((dCash>0?'+$':'-$')+Math.abs(dCash), player.x, player.y-0.2, dCash>0?'#8fe08f':'#ff9a9a'); }
}
function updateActivity(dt){
  const A=G.activity; if(!A) return;
  A.t-=dt;
  if(!player.seated){ G.activity=null; return; } // stood up mid-activity: it evaporates
  if(A.t<=0){
    if(A.type==='quiz') resolveActivity('time\'s up. you wrote your own name wrong. somehow.', 6, 0);
    else if(A.type==='called') resolveActivity('you said "uhhhhh" for seven straight seconds.', 8, 0);
    else if(A.type==='awake'){ bigText('ZZZ 💤', player.x, player.y-0.3); resolveActivity('you snored. LOUDLY. with your whole chest.', 10, 0); }
    else resolveActivity('the note blew away. mysterious. spooky, even.', 0, 0);
  }
}
function answerQuiz(i){
  const A=G.activity; if(!A||A.type!=='quiz') return;
  if(i===A.q.c){ if(G.camp) addClout(3,'aced the quiz'); resolveActivity('CORRECT ✅ teacher gave you a Lunchable (resale value $6)', -12, 6); }
  else resolveActivity(A.q.roast, 4, 0);
}
function answerCalled(i){
  const A=G.activity; if(!A||A.type!=='called') return;
  if(i===A.q.c){ if(G.camp) addClout(3,'crushed it when called on'); resolveActivity(A.q.praise+' ✅', -8, 4); }
  else resolveActivity(A.q.roast, 8, 0);
}
function tapAwake(){
  const A=G.activity; if(!A||A.type!=='awake') return;
  A.taps++;
  if(A.taps>=A.need){ if(G.camp) addClout(3,'stayed woke'); resolveActivity('you look SO engaged. teacher\'s pet arc.', -10, 0); }

function update(dt){
  // cash tick-up always
  G.cashShown = Math.abs(G.cashShown-G.cash)<1? G.cash : lerp(G.cashShown,G.cash,0.18);
  if(G.screen!=='play'){ return; }

  // dialog / overlay timers
  if(G.dialog){ G.dialog.t-=dt; if(G.dialog.t<=0)G.dialog=null; }
  if(G.bustFlash>0)G.bustFlash-=dt;
  if(G.ringShake>0)G.ringShake=Math.max(0,G.ringShake-dt*1.6);
  if(G.cashPop>0)G.cashPop=Math.max(0,G.cashPop-dt*2.4);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*22);
  if(player.stagger>0)player.stagger=Math.max(0,player.stagger-dt);
  if(player.dizzy>0)player.dizzy=Math.max(0,player.dizzy-dt);
  // toasts (age for slide-in easing)
  for(let i=G.toasts.length-1;i>=0;i--){ G.toasts[i].t-=dt; G.toasts[i].age+=dt; if(G.toasts[i].t<=0)G.toasts.splice(i,1); }

  // particles always tick (juice keeps flowing)
  updateBills(dt); updateFloats(dt); updatePuffs(dt); updateFogs(dt);

  // freeze world while shop/offer open (still render)
  const frozen = G.shop || G.offer;

  // schedule
  if(!frozen){
    if(G.ringT>0) G.ringT-=dt;
    G.periodT+=dt;
    const p0=PERIODS[G.periodIdx];
    if(p0.kind!=='end' && G.periodT>=p0.dur){ advancePeriod(); }
  }
  const p=PERIODS[G.periodIdx];

  // lesson scroll
  if(p.kind==='class'){ G.lessonT+=dt; if(G.lessonT>4){ G.lessonT=0; G.lessonIdx=(G.lessonIdx+1)%TEACHER_LESSONS.length; } }

  // teacher-shove delayed bust (let the ragdoll land first, for comedy timing)
  if(G.teacherBustT>0){ G.teacherBustT-=dt; if(G.teacherBustT<=0) busted(); }

  // in-class activity scheduling
  if(!frozen){
    if(p.kind==='class' && player.seated && !G.dialog && !G.activity){
      G.actT-=dt;
      if(G.actT<=0){ G.actT=rand(9,14); startActivity(); }
    }
    updateActivity(dt);
  }

  // heat dynamics
  if(!frozen){
    if(p.kind==='class'){
      if(player.seated) G.heat=clamp(G.heat-9*dt,0,100);
      else G.heat=clamp(G.heat+3.5*dt,0,100);
    } else if(p.kind==='gym'){
      G.heat=clamp(G.heat-2.5*dt,0,100); // gym cover; coach handles absence heat
    } else {
      G.heat=clamp(G.heat-3*dt,0,100);
    }
  }

  // ---- FIRST PERSON camera: yaw, bob, view-model timers ----
  const FPON = (VIEW==='fp');
  if(FPON){
    if(player.seated){
      const want=Math.atan2(board.y-player.y, board.x-player.x)
        + Math.sin(fpBobT*0.23)*0.32;                 // slow bored look-drift toward the window
      fpYaw += angDiff(want,fpYaw)*Math.min(1,dt*3.2);
    } else {
      let ky=0;
      if(keys['arrowleft']) ky-=1;
      if(keys['arrowright']) ky+=1;
      if(ky) fpYaw += ky*2.3*dt;
    }
    player.facing=fpYaw;
    fpBobT += dt*(player.moving?(player.sneak?7:11):(player.seated?1.1:2.2));
    const bAmp = player.moving?(player.sneak?1.6:3.0):(player.seated?1.6:0.8);
    fpBob = Math.sin(fpBobT)*bAmp + (player.stagger>0?Math.sin(fpBobT*5)*5:0);
    fpKick = lerp(fpKick, 0, Math.min(1,dt*7));
    fpFovAdd = lerp(fpFovAdd, player.moving&&!player.sneak?0.055:0, Math.min(1,dt*4));
    VM.deal=Math.max(0,VM.deal-dt*1.5);
    VM.shove=Math.max(0,VM.shove-dt*3.2);
    VM.thr=Math.max(0,VM.thr-dt*4);
    if(G.fpCaught) G.fpCaught=Math.max(0,G.fpCaught-dt*1.6);
    FPT = (!frozen&&!G.activity)? fpPickTarget() : null;
  } else { FPT=null; player.sneak=false; }

  // player movement (staggered = slower + wobble)
  if(!frozen && !player.seated && !player.rag){
    const v = FPON? inputVectorFP() : inputVector();
    const spd=3.6 * (player.stagger>0?0.45:1) * (player.sneak?0.55:1);
    const tx=v.x*spd, ty=v.y*spd;
    player.vx=lerp(player.vx,tx,0.22); player.vy=lerp(player.vy,ty,0.22);
    const sp=Math.hypot(player.vx,player.vy);
    if(sp>0.05){ moveActor(player,player.vx,player.vy,dt); player.moving=true; player.phase+=dt*11;
      if(!FPON && v.mag>0.05)player.facing=Math.atan2(player.vy,player.vx);
      // footstep dust + procedural footstep audio
      player.stepT=(player.stepT||0)+dt;
      if(player.stepT>(player.sneak?0.38:0.26)){ player.stepT=0;
        if(sp>1.4) addPuff(player.x,player.y+0.1,1);
        if(sp>0.9) SFX.step(grid[gi(clamp(Math.floor(player.x),0,MW-1),clamp(Math.floor(player.y),0,MH-1))], player.sneak);
      }
    } else player.moving=false;
  } else { player.moving=false; player.vx=0; player.vy=0; }
  audioTick(dt);

  if(!frozen){
    updateMonitor(dt); updateCustomers(dt); updateRagdolls(dt);
    updateChadwick(dt); updateGym(dt); softCollide();
    updateTeachers(dt); updateAmbients(dt);
    checkSupplyPickup();
  }

  updateCam(player.x, player.y);
}

function floorColorFor(t,x,y){
  const chk=((x+y)&1)===0;
  switch(t){
    case F_HALL: return chk?'#c3ccdb':'#b6c0d1';
    case F_CLASSA: return chk?'#e0cfa4':'#d7c599';
    case F_CLASSB: return chk?'#d3ddba':'#c9d3ad';
    case F_BATH: return chk?'#c6e6ea':'#b6dce1';
    case F_JAN: return chk?'#c3bba7':'#b8b09b';
    case F_GYM: return chk?'#d7a967':'#cfa05d';   // wood court
    case F_LOCKER: return chk?'#8fb0c0':'#84a6b6'; // tile
    case F_SUPPLY: return chk?'#b0a58e':'#a89d84';
  }
  return '#333';
}
// warm directional light: tint a floor color toward light source (top-left-ish)
function litFloor(base,x,y){
  const t=clamp(0.5 + (x*0.6 - y*0.5)/ (MW+MH), 0.2,0.9);
  return shade(base, 0.9 + t*0.22);
}

  }

  draws.sort((p,q)=> (p.d-q.d)|| (p.z-q.z));
  for(const dr of draws){

function drawRagdoll(a){
  const r=a.rag; const pal=a.pal;
  const px=sx(a.x,a.y), py=sy(a.x,a.y,r.z);
  // ground shadow scales with height
  const sc=clamp(1-r.z/60,0.3,1);
  ctx.fillStyle='rgba(18,10,26,'+(0.22*sc)+')'; ctx.beginPath(); ctx.ellipse(sx(a.x,a.y),sy(a.x,a.y,0),12*sc,6*sc,0,0,7); ctx.fill();
  ctx.save(); ctx.translate(px,py-12); ctx.rotate(r.ang);
  const sq=a.squash||0; const w=20*(1+sq*0.4), h=28*(1-sq*0.45);
  // limbs (flailing)
  ctx.strokeStyle=pal.legs; ctx.lineWidth=4; ctx.lineCap='round';
  const fl=Math.sin(r.t*20)*9;
  ctx.beginPath(); ctx.moveTo(-w*0.3,h*0.3); ctx.lineTo(-w*0.6, h*0.3+fl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w*0.3,h*0.3); ctx.lineTo(w*0.6, h*0.3-fl); ctx.stroke();
  ctx.strokeStyle=pal.skin;
  ctx.beginPath(); ctx.moveTo(-w*0.3,-h*0.1); ctx.lineTo(-w*0.7,-h*0.1-fl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w*0.3,-h*0.1); ctx.lineTo(w*0.7,-h*0.1+fl); ctx.stroke();
  // body
  ctx.fillStyle=pal.body; rr(-w/2,-h/2,w,h,6); ctx.fill();
  if(pal.polo){ ctx.fillStyle=pal.body2; rr(-w/2,-h/2,w,7,3); ctx.fill(); if(pal.chain){ ctx.strokeStyle='#ffd54a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-h/2+5,5,0.2,Math.PI-0.2); ctx.stroke(); } }
  if(pal.sash){ ctx.strokeStyle=pal.sash; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-w/2,-h/2); ctx.lineTo(w/2,h/2); ctx.stroke(); }
  // head
  ctx.fillStyle=pal.skin; ctx.beginPath(); ctx.arc(0,-h/2-6,8,0,7); ctx.fill();
  ctx.fillStyle=pal.hair; ctx.beginPath(); ctx.arc(0,-h/2-8,8,Math.PI,0); ctx.fill();
  // x_x dazed eyes when down
  ctx.strokeStyle='#20242e'; ctx.lineWidth=1.5;
  if(r.state==='down'){ for(const ex of [-3,3]){ ctx.beginPath(); ctx.moveTo(ex-2,-h/2-8); ctx.lineTo(ex+2,-h/2-4); ctx.moveTo(ex+2,-h/2-8); ctx.lineTo(ex-2,-h/2-4); ctx.stroke(); } }
  else { ctx.fillStyle='#20242e'; ctx.beginPath(); ctx.arc(-3,-h/2-6,1.6,0,7); ctx.arc(3,-h/2-6,1.6,0,7); ctx.fill(); }
  ctx.restore();
  ctx.lineCap='butt';
  // dazed stars
  if(r.state==='down'){ drawStars(px, py-40, r.t*4); }
  // sunglasses flying off (chadwick)
  const sf=a.shadesFly; if(sf){ const spx=sx(sf.x,sf.y),spy=sy(sf.x,sf.y,sf.z); ctx.save(); ctx.translate(spx,spy); ctx.rotate(sf.rot); ctx.fillStyle='#1a1a22'; ctx.fillRect(-7,-2,6,4); ctx.fillRect(1,-2,6,4); ctx.fillRect(-1,-1,2,1.5); ctx.restore(); }
}
function drawCone(m){
  if(!m)return;
  const r=6.2, a=m.facing, spread=0.85;
  ctx.save();
  ctx.globalAlpha= m.mode==='chase'?0.18:0.10;
  ctx.fillStyle= m.mode==='chase'?'#ff4d4d':'#ffd24d';
  ctx.beginPath();
  ctx.moveTo(sx(m.x,m.y), sy(m.x,m.y,10));
  for(let i=-1;i<=1;i+=0.25){
    const ang=a+spread*i; const px=m.x+Math.cos(ang)*r, py=m.y+Math.sin(ang)*r;
    ctx.lineTo(sx(px,py), sy(px,py,2));
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function wrapText(txt,cx,y,maxw,lh){
  const words=txt.split(' '); let line='',yy=y;
  const lines=[];
  for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxw&&line){lines.push(line);line=w;}else line=test; }
  if(line)lines.push(line);
  yy=y-(lines.length-1)*lh;
  for(const l of lines){ ctx.fillText(l,cx,yy); yy+=lh; }
}

// Fully procedural WebAudio. Zero assets. Starts on the first user gesture.
const AU={ctx:null,master:null,muted:false,amb:null,ambF:null,ambG:null,chaseO:null,chaseG:null,noise:null,room:-1,heartT:0};
try{ AU.muted = localStorage.getItem('fg_mute')==='1'; }catch(e){}
function auStart(){
  if(AU.ctx){ if(AU.ctx.state==='suspended'){ try{AU.ctx.resume();}catch(e){} } return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const c=new AC(); AU.ctx=c;
    const m=c.createGain(); m.gain.value=AU.muted?0:0.5; m.connect(c.destination); AU.master=m;
    const len=Math.floor(c.sampleRate*1.5); const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.noise=buf;
    // looping room tone
    const s=c.createBufferSource(); s.buffer=buf; s.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=300; f.Q.value=0.7;
    const g=c.createGain(); g.gain.value=0.0;
    s.connect(f); f.connect(g); g.connect(m); s.start();
    AU.amb=s; AU.ambF=f; AU.ambG=g;
    // hall-monitor chase drone
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=64;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=460;
    const og=c.createGain(); og.gain.value=0;
    o.connect(lp); lp.connect(og); og.connect(m); o.start();
    AU.chaseO=o; AU.chaseG=og;
  }catch(e){ AU.ctx=null; }
}
function auMute(v){
  AU.muted=!!v; try{ localStorage.setItem('fg_mute',AU.muted?'1':'0'); }catch(e){}
  if(AU.ctx&&AU.master){ try{ AU.master.gain.setTargetAtTime(AU.muted?0:0.5, AU.ctx.currentTime, 0.04); }catch(e){} }
}
function auTone(freq,dur,type,vol,slide,delay){
  const c=AU.ctx; if(!c||AU.muted) return;
  try{
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(24,slide), t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0003,vol||0.2), t+Math.min(0.02,dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function auNoise(dur,vol,f0,f1,type,delay){
  const c=AU.ctx; if(!c||AU.muted||!AU.noise) return;
  try{
    const t=c.currentTime+(delay||0);
    const s=c.createBufferSource(); s.buffer=AU.noise; s.loop=true;
    const bf=c.createBiquadFilter(); bf.type=type||'bandpass'; bf.Q.value=1.0;
    bf.frequency.setValueAtTime(f0,t);
    if(f1) bf.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0003,vol||0.15), t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(bf); bf.connect(g); g.connect(AU.master); s.start(t); s.stop(t+dur+0.03);
  }catch(e){}
}
